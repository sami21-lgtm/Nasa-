# Deploy on Render (https://render.com): New + > Blueprint > pick this repo.
services:
  - type: web
    name: spaceskribble
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: NASA_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
