
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SpaceSkribble</title>

  <script src="./js/config.js"></script>
  <script src="./js/gate.js"></script>
  <link rel="stylesheet" href="./style.css">

  <style>
    .auth-screen {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      position: relative;
      isolation: isolate;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: clamp(24px, 5vw, 38px);
      position: relative;
      z-index: 1;
      background: rgba(14, 18, 44, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45),
                  inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 26px;
    }

    .auth-brand a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--ink, #f4f1ea);
      font: 800 22px var(--display, system-ui);
      text-decoration: none;
    }

    .auth-brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff3c4,
                  var(--sun-2, #ffd166) 30%, var(--sun, #ff8a3d) 65%, #a1381a);
      box-shadow: 0 0 24px rgba(255, 138, 61, 0.6);
    }

    .auth-card h1 {
      text-align: center;
      font-size: clamp(30px, 6vw, 38px);
      margin: 0 0 10px;
      color: var(--ink, #f4f1ea);
    }

    .auth-description {
      text-align: center;
      color: var(--muted, rgba(244, 241, 234, 0.64));
      margin: 0 0 24px;
      font-size: 15px;
    }

    .auth-form {
      display: grid;
      gap: 16px;
    }

    .auth-form label {
      display: grid;
      gap: 7px;
      color: var(--muted, rgba(244, 241, 234, 0.64));
      font-size: 14px;
    }

    .auth-form input {
      width: 100%;
      min-width: 0;
      padding: 14px 15px;
      color: var(--ink, #f4f1ea);
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--line, rgba(255,255,255,0.1));
      border-radius: 14px;
      font: 500 16px var(--body, Arial, sans-serif);
    }

    .auth-form input::placeholder {
      color: rgba(244, 241, 234, 0.42);
    }

    .auth-form input:focus {
      outline: none;
      border-color: var(--ion, #5ce1ff);
      box-shadow: 0 0 0 4px rgba(92, 225, 255, 0.15);
    }

    .auth-submit {
      width: 100%;
      min-height: 50px;
      margin-top: 6px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--sun-2, #ffd166),
                  var(--sun, #ff8a3d) 55%, #ff5e7e);
      color: #1b0f05;
      font: 700 16px var(--body, Arial, sans-serif);
      cursor: pointer;
      box-shadow: 0 12px 30px -10px rgba(255, 138, 61, 0.55);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .auth-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px -12px rgba(255, 138, 61, 0.8);
    }

    .auth-message {
      margin: 12px 0 0;
      text-align: center;
      overflow-wrap: anywhere;
      color: var(--ion, #5ce1ff);
      font-size: 14px;
    }

    .auth-footer {
      margin: 22px 0 0;
      text-align: center;
      color: var(--muted, rgba(244, 241, 234, 0.64));
      font-size: 14px;
    }

    .auth-footer a,
    .auth-back {
      color: var(--ion, #5ce1ff);
      text-decoration: none;
    }

    .auth-footer a:hover,
    .auth-back:hover {
      color: var(--sun-2, #ffd166);
    }

    .auth-back {
      display: block;
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }
    .auth-brand .brand {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--ink, #f4f1ea);
  font: 800 22px var(--display, system-ui);
  text-decoration: none;
}

.auth-brand .brand-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
  </style>
</head>

<body>
  <main class="auth-screen">
    <section class="auth-card">
<div class="auth-brand">
  <a class="brand" href="./index.html">
    <span class="brand-mark" aria-hidden="true">
      <span class="ring"></span>
    </span>
    <span>SpaceSkribble</span>
  </a>
</div>

      <p class="eyebrow" data-i18n="login.eyebrow">WELCOME BACK, EXPLORER</p>
      <h1 data-i18n="login.title">Welcome Back</h1>
      <p class="auth-description" data-i18n="login.desc">Sign in and continue your cosmic adventure.</p>

      <form id="login-form" class="auth-form">
        <label>
          <span data-i18n="reg.email">Email Address</span>
          <input id="login-email" type="email"
                 placeholder="you@example.com"
                 autocomplete="email" required>
        </label>

        <label>
          <span data-i18n="login.password">Password</span>
          <input id="login-password" type="password"
                 placeholder="Enter your password" data-i18n-ph="login.passwordPh"
                 autocomplete="current-password" required>
        </label>

        <button class="auth-submit" type="submit" data-i18n="login.submit">Login to SpaceSkribble</button>
      </form>

      <p id="auth-message" class="auth-message"
         role="status" aria-live="polite"></p>

      <p class="auth-footer">
        <span data-i18n="login.new">New player?</span> <a href="./register.html" data-i18n="login.create">Create an account</a>
      </p>

    </section>
  </main>

  <script src="./js/i18n.js"></script>
  <script src="./js/auth.js"></script>

</body>
</html>
